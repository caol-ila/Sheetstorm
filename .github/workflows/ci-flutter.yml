name: Flutter CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Get dependencies
        working-directory: sheetstorm_app
        run: flutter pub get

      - name: Analyze
        working-directory: sheetstorm_app
        run: flutter analyze

      - name: Test
        working-directory: sheetstorm_app
        run: flutter test
