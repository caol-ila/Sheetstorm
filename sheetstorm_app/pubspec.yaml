name: sheetstorm_app
description: "Notenmanagement-App für Blaskapellen"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  go_router: ^14.0.0
  drift: ^2.18.0
  drift_flutter: ^0.2.0
  intl: any
  http: ^1.2.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.4.11
  riverpod_generator: ^2.4.0
  drift_dev: ^2.18.0
  mocktail: ^1.0.3

flutter:
  generate: true
  uses-material-design: true
