[package]
name = "omr-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "omr-server"
path = "src/main.rs"

[[bin]]
name = "omr-cli"
path = "src/bin/omr-cli.rs"

[[bin]]
name = "omr-bench"
path = "src/bin/omr-bench.rs"

[[bin]]
name = "omr-sig-inspect"
path = "src/bin/omr-sig-inspect.rs"

[dependencies]
omr-pipeline.workspace = true
omr-musicxml.workspace = true
omr-core.workspace = true
omr-symbols.workspace = true
omr-sig.workspace = true
omr-sig-store.workspace = true
axum.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
clap.workspace = true

[dev-dependencies]
http-body-util = "0.1"

[features]
default = []
# Aktiviert die CNN-basierte Symbol-Klassifikation in omr-symbols.
# Tract-onnx braucht keinen C-Compiler, läuft pure-Rust.
cnn = ["omr-symbols/cnn", "omr-pipeline/cnn"]
